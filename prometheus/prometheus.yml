global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则
rule_files:
  - "alerts.yml"

# 告警管理器
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # 应用自身的 /metrics 端点（NestJS prom-client）
  - job_name: 'campus-print-app'
    static_configs:
      - targets: ['host.docker.internal:3000']
    metrics_path: '/metrics'

  # 宿主机指标
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
