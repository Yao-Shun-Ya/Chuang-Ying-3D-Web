global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default'

receivers:
  - name: 'default'
    # 生产环境替换为实际的 webhook / 邮箱
    webhook_configs:
      - url: 'http://localhost:5001/alert-webhook'
        send_resolved: true
