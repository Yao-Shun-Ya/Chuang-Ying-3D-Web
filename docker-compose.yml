version: '3.8'

services:
  # ---------- PostgreSQL（生产级主库） ----------
  postgres:
    image: postgres:16-alpine
    container_name: campus-print-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=campusapp
      # 生产环境务必通过 .env（compose 变量注入）改为强密码
      - POSTGRES_PASSWORD=${PG_PASSWORD:-change-me-in-production}
      - POSTGRES_DB=campusprint
      - TZ=Asia/Shanghai
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusapp -d campusprint"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  # ---------- 主应用（NestJS + 前端静态资源） ----------
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus-print-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # PostgreSQL 连接（指向上方 postgres 服务）
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=campusapp
      - PG_PASSWORD=${PG_PASSWORD:-change-me-in-production}
      - PG_DATABASE=campusprint
      - PG_SSL=false
      - PG_TZ=Asia/Shanghai
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - THROTTLE_TTL=60
      - THROTTLE_LIMIT=10
      - LOG_LEVEL=info
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=true
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    volumes:
      - app-data:/app/server/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-net

  # ---------- Nginx 反向代理（HTTPS / 静态资源 / 限流） ----------
  nginx:
    image: nginx:1.27-alpine
    container_name: campus-print-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - server
    networks:
      - app-net

volumes:
  pg-data:
  app-data:

networks:
  app-net:
    driver: bridge